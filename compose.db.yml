# PostgreSQL only. The app runs on the host via `pnpm dev` (Vite HMR + tsx watch).
services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - .env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaneo -d kaneo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
    external: true
    name: kaneo-main_postgres_data
